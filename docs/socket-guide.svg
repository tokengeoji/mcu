  <text x="40" y="1052" class="sm">SG90 빨간색은 서보용 별도 전원 +에 연결한다. 갈색은 서보 전원 −, 센서 전원 −, J5 4번과 같은 GND 레일에 꽂는다.</text>
  <text x="40" y="1081" class="sm">소켓 위치 근거 · 실험1-GPIO-InputOutput 교재 20쪽 보드 사진·소켓 표, 21쪽 J5 회로도</text>
