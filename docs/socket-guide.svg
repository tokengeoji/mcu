  <rect x="741" y="202" width="339" height="369" rx="12" class="panel"/>
  <text x="762" y="242" class="section">J5 4번 · 공통 GND</text>
  <text x="762" y="276" class="sm">J3와 MCU 칩 사이의 검은</text>
  <text x="762" y="301" class="sm">2×10 JTAG 헤더다.</text>
  <text x="762" y="343" class="pin">J5의 1번 표시를 먼저 찾는다.</text>
  <rect x="764" y="361" width="292" height="84" rx="7" fill="#edf3f1"/>
  <g class="pin" text-anchor="middle">
    <text x="797" y="390">1</text><text x="858" y="390">3</text><text x="918" y="390">5</text><text x="976" y="390">⋯</text><text x="1025" y="390">19</text>
    <text x="797" y="427">2</text><rect x="838" y="403" width="40" height="32" rx="4" fill="#344955"/>
    <text x="858" y="427" style="fill:white">4</text><text x="918" y="427">6</text><text x="976" y="427">⋯</text><text x="1025" y="427">20</text>
  </g>
  <text x="762" y="480" class="sm">1번 맞은편이 2번이다. 2번과</text>
  <text x="762" y="505" class="sm">같은 줄의 바로 다음 핀이 4번이다.</text>
  <text x="762" y="543" class="pin">4번 → 브레드보드 − 레일</text>

  <rect x="40" y="587" width="1040" height="56" rx="6" fill="#e7eff0"/>
  <text x="58" y="622" class="body">PA0 ← ECHO</text><text x="247" y="622" class="body">PC8 → TRIG</text>
  <text x="416" y="622" class="body">PA8 → 서보 주황선</text><text x="582" y="622" class="body">PA6 → PIEZO</text>
  <text x="768" y="622" class="body">PB10 → 키트 TX0 (선택)</text>

  <text x="40" y="699" class="section">센서 한 개를 브레드보드에 연결</text>
  <text x="40" y="731" class="sm">전원을 끄고 센서에 인쇄된 VCC·TRIG·ECHO·GND를 확인한다. 같은 번호의 A–E 구멍 다섯 개는 내부에서 연결된다.</text>
  <rect x="40" y="752" width="1040" height="266" rx="9" class="panel"/>
  <rect x="353" y="764" width="311" height="240" rx="8" fill="#eef2f0" stroke="#bdcdc8"/>
