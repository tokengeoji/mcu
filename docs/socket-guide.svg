  <rect width="1120" height="1102" fill="#f4f8f7"/>
  <text x="39" y="57" class="title">실습 키트 소켓과 브레드보드 꽂는 위치</text>
  <text x="40" y="93" class="body">서보 회전식 초음파 탐지기 · HBE-MCU-MULTI / STM32F103RBT6</text>

  <text x="40" y="151" class="section">보드에서 신호 핀 찾기</text>
  <text x="40" y="181" class="sm">부품 면을 위로 놓고 오른쪽 아래의 빨간 RESET을 기준으로 돌려 맞춘다. 강조한 구멍과 기판의 글자를 함께 확인한다.</text>
