      .pin { font-size: 18px; font-weight: 700; }
      .panel { fill: #fff; stroke: #b6cbd0; stroke-width: 1.5; }
    </style>
    <g id="pair"><circle cx="0" cy="0" r="3.5"/><circle cx="11" cy="0" r="3.5"/></g>
    <g id="pairjtag"><circle cx="0" cy="0" r="3"/><circle cx="12" cy="0" r="3"/></g>
