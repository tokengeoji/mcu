<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1102" viewBox="0 0 1120 1102" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">STM32 실습 키트 소켓 위치와 HC-SR04P 한 개의 브레드보드 결선</title>
  <desc id="desc">RESET이 오른쪽 아래일 때 왼쪽 헤더는 J3, 오른쪽은 J4, J3와 MCU 사이가 J5다.
    PA0, PA6, PA8은 J3 왼쪽 열, PB10은 J3 오른쪽 열, PC8은 J4 왼쪽 열에 있다.
    J5 4번은 공통 접지다. 센서 VCC, TRIG, ECHO, GND를 E3, E4, E5, E6에 꽂고
    양극 레일에서 A3, PC8에서 B4, PA0에서 B5, 음극 레일에서 A6으로 연결한다.</desc>
