<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 894" width="1440" height="894" role="img" aria-labelledby="placementTitle placementDesc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="placementTitle">모형 복도와 장비 배치</title>
<desc id="placementDesc">네 복도가 오른쪽, 아래, 왼쪽, 아래로 이어진다. S1부터 S4 순서로 복도를 감시하며 S4는 목적지 쪽에서 위를 본다. S5는 별도 위험 구역에 접근하는 물체를 감지한다. 모든 설치 위치와 감지 방향은 보정 전 예시다.</desc>
<defs><marker id="pMove" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#182D36"/></marker><marker id="pSense" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#006E67"/></marker><marker id="pHaz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#A33929"/></marker></defs>
<rect x="0" y="0" width="1440" height="894" rx="0" fill="#F5F8F7" stroke="none" stroke-width="1.5"/>
<text x="48" y="63" fill="#182D36" font-size="41" font-weight="700" text-anchor="start">모형 복도와 장비 배치</text>
<text x="50" y="104" fill="#425866" font-size="21" font-weight="400" text-anchor="start">위에서 본 설치 예시 · 센서의 위치와 방향은 모형에서 실측·보정 후 확정</text>
<rect x="48" y="142" width="924" height="606" rx="12" fill="#FFFFFF" stroke="#BFCFD3" stroke-width="1.5"/>
<text x="76" y="188" fill="#182D36" font-size="24" font-weight="700" text-anchor="start">현장 모형</text>
