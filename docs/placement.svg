<text x="452" y="692" fill="#425866" font-size="17" font-weight="400" text-anchor="start">도착 명령 뒤 키패드 0을 눌러 개방</text>
<rect x="994" y="142" width="398" height="606" rx="12" fill="#FFFFFF" stroke="#BFCFD3" stroke-width="1.5"/>
<text x="1020" y="188" fill="#182D36" font-size="24" font-weight="700" text-anchor="start">장비를 두는 곳</text>
<path d="M1020 210 H1365" fill="none" stroke="#BFCFD3" stroke-width="1" />
<rect x="1020" y="240" width="7" height="99" rx="3" fill="#006E67" stroke="none" stroke-width="1.5"/>
<text x="1045" y="261" fill="#182D36" font-size="22" font-weight="700" text-anchor="start">관제소 책상</text>
<text x="1045" y="299" fill="#182D36" font-size="18" font-weight="400" text-anchor="start">PC · ESP32-L · DESPI-C02</text>
<text x="1045" y="329" fill="#425866" font-size="17" font-weight="400" text-anchor="start">전자종이 지도에서 위치 확인</text>
<rect x="1020" y="370" width="7" height="110" rx="3" fill="#182D36" stroke="none" stroke-width="1.5"/>
<text x="1045" y="391" fill="#182D36" font-size="22" font-weight="700" text-anchor="start">현장 키트</text>
<text x="1045" y="430" fill="#182D36" font-size="18" font-weight="400" text-anchor="start">STM32 · LED 2개 · PIEZO</text>
<text x="1045" y="460" fill="#425866" font-size="17" font-weight="400" text-anchor="start">센서 배선과 공통 GND 연결</text>
<rect x="1020" y="510" width="7" height="116" rx="3" fill="#A33929" stroke="none" stroke-width="1.5"/>
<text x="1045" y="531" fill="#182D36" font-size="22" font-weight="700" text-anchor="start">목적지 조작부</text>
<text x="1045" y="570" fill="#182D36" font-size="18" font-weight="400" text-anchor="start">4 × 3 키패드 · 모형 문 · SG90</text>
<text x="1045" y="600" fill="#425866" font-size="17" font-weight="400" text-anchor="start">키트 키패드는 케이블로 연결</text>
<path d="M1020 652 H1365" fill="none" stroke="#BFCFD3" stroke-width="1" />
<text x="1020" y="695" fill="#425866" font-size="17" font-weight="400" text-anchor="start">복도 점검은 한 센서씩 표적을 움직여</text>
<text x="1020" y="720" fill="#425866" font-size="17" font-weight="400" text-anchor="start">RAW의 해당 열이 변하는지 확인한다.</text>
<rect x="48" y="771" width="1344" height="88" rx="11" fill="#EAF0F1" stroke="none" stroke-width="1.5"/>
<text x="72" y="808" fill="#182D36" font-size="20" font-weight="700" text-anchor="start">실측 항목</text>
<text x="226" y="808" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">각 센서의 설치점·높이·방향, 복도 길이, 빈 복도의 배경 거리, 코너의 중복·미검출 구간</text>
<text x="226" y="839" fill="#425866" font-size="17" font-weight="400" text-anchor="start">S5의 접근·해제 거리와 서보의 끝점을 보정한다. 도면은 축척이나 전원 배선 길이를 지정하지 않는다.</text>
</svg>
