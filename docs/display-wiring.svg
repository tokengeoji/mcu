<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1320" viewBox="0 0 1520 1320" role="img" aria-labelledby="dw-title dw-desc"><title id="dw-title">STM32와 전자종이 표시부 결선도</title><desc id="dw-desc">STM32와 ESP32-L의 UART 두 선과 공통 접지, ESP32-L P5와 DESPI-C02 P2의 여덟 선, 패널 리본과 개별 전원 연결을 나타낸다.</desc><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1520" height="1320" rx="0" fill="#F6F9FA" stroke="none" stroke-width="2"/>
<text x="64" y="77" fill="#193747" font-size="46" font-weight="700">STM32와 전자종이 표시부 결선도</text>
<text x="66" y="119" fill="#456371" font-size="23">전원을 끄고 단자 이름을 대조한다. 화살표는 신호나 전원을 보내는 방향이다.</text>
<text x="64" y="178" fill="#193747" font-size="31" font-weight="700">보드 간 UART</text>
<text x="1448" y="177" fill="#456371" font-size="22" text-anchor="end">3.3 V TTL   ·   115200 baud   ·   8N1</text>
<rect x="65" y="203" width="432" height="268" rx="12" fill="#E7F2F4" stroke="#A9C7CD" stroke-width="2"/>
<rect x="998" y="203" width="457" height="268" rx="12" fill="#E6F1F8" stroke="#A2C4D6" stroke-width="2"/>
<text x="91" y="248" fill="#193747" font-size="30" font-weight="700">STM32F103RBT6</text>
<text x="91" y="280" fill="#456371" font-size="20">한백 MCU 모듈 · 키트 전원</text>
<text x="1028" y="248" fill="#193747" font-size="30" font-weight="700">Good Display ESP32-L</text>
<text x="1028" y="280" fill="#456371" font-size="20">P6 헤더 · 보드 USB 입력 5 V</text>
<text x="91" y="331" fill="#193747" font-size="26" font-weight="700">J3  PB10</text>
<text x="465" y="330" fill="#456371" font-size="21" text-anchor="end">USART3 TX</text>
