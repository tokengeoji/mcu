<text x="1429" y="440" fill="#456371" font-size="20" text-anchor="end">공통 접지</text>
<text x="65" y="508" fill="#456371" font-size="22">두 보드는 각자 전원을 공급한다. 보드 사이에는 위의 세 선만 연결하고 각 전원의 양극은 분리한다.</text>
<text x="65" y="585" fill="#193747" font-size="31" font-weight="700">전자종이 8핀 헤더</text>
<text x="1455" y="585" fill="#456371" font-size="22" text-anchor="end">두 기판의 3.3V 표기를 같은 쪽에 맞춰 결합</text>
