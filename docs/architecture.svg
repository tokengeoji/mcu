<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860" role="img" aria-labelledby="archTitle archDesc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="archTitle">하드웨어 신호 구조</title>
<desc id="archDesc">키트 STM32가 센서 다섯 개를 순차 측정하고 LED, 부저, 키패드와 문을 제어한다. PC는 USART1로 연결하며 ESP32-L과 USART3로 상태를 교환한다. ESP32-L은 DESPI-C02를 거쳐 전자종이 패널을 구동한다.</desc>
<defs><marker id="aArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#006E67"/></marker></defs>
<rect x="0" y="0" width="1440" height="860" rx="0" fill="#F5F8F7" stroke="none" stroke-width="1.5"/>
<text x="48" y="63" fill="#182D36" font-size="41" font-weight="700" text-anchor="start">하드웨어 신호 구조</text>
<text x="50" y="103" fill="#425866" font-size="21" font-weight="400" text-anchor="start">관제 명령과 위치 데이터를 전달하는 두 보드, 현장 입출력, 전자종이 연결</text>
<rect x="48" y="156" width="258" height="129" rx="12" fill="#FFFFFF" stroke="#BFCFD3" stroke-width="1.5"/>
<text x="70" y="198" fill="#182D36" font-size="28" font-weight="700" text-anchor="start">관제 PC</text>
<text x="70" y="235" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">키트 UART 모듈 USB</text>
<text x="70" y="264" fill="#425866" font-size="18" font-weight="400" text-anchor="start">관제 명령 · RAW 조회</text>
<rect x="450" y="146" width="348" height="150" rx="12" fill="#143641" stroke="none" stroke-width="1.5"/>
<text x="477" y="190" fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="start">STM32F103RBT6</text>
<text x="477" y="229" fill="#BEE1DD" font-size="20" font-weight="400" text-anchor="start">HBE-MCU-MULTI</text>
<text x="477" y="267" fill="#FFFFFF" font-size="19" font-weight="400" text-anchor="start">거리 측정 · 위치 판정 · 현장 제어</text>
<rect x="998" y="146" width="394" height="150" rx="12" fill="#E4F3EF" stroke="#95C7BD" stroke-width="1.5"/>
<text x="1024" y="190" fill="#006E67" font-size="30" font-weight="700" text-anchor="start">ESP32-L</text>
<text x="1024" y="229" fill="#182D36" font-size="20" font-weight="400" text-anchor="start">Good Display · ESP32-S 모듈</text>
<text x="1024" y="267" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">UART2 수신 · 전자종이 지도 갱신</text>
<path d="M312 220 H444" fill="none" stroke="#006E67" stroke-width="2.5" marker-end="url(#aArrow)" marker-start="url(#aArrow)"/>
<text x="378" y="202" fill="#182D36" font-size="18" font-weight="700" text-anchor="middle">USART1</text>
<text x="378" y="250" fill="#425866" font-size="16" font-weight="400" text-anchor="middle">9600 · 8N1</text>
<path d="M805 220 H991" fill="none" stroke="#006E67" stroke-width="2.5" marker-end="url(#aArrow)" marker-start="url(#aArrow)"/>
<text x="898" y="202" fill="#182D36" font-size="17" font-weight="700" text-anchor="middle">USART3 ↔ UART2</text>
<text x="898" y="250" fill="#425866" font-size="16" font-weight="400" text-anchor="middle">115200 · 8N1</text>
<path d="M620 299 V341 H235 V390" marker-start="url(#aArrow)" fill="none" stroke="#006E67" stroke-width="2.5" marker-end="url(#aArrow)"/>
<path d="M620 341 H713 V390" fill="none" stroke="#006E67" stroke-width="2.5" marker-end="url(#aArrow)"/>
<circle cx="620" cy="341" r="4" fill="#006E67"/>
<path d="M1195 299 V390" marker-start="url(#aArrow)" fill="none" stroke="#006E67" stroke-width="2.5" marker-end="url(#aArrow)"/>
<text x="1211" y="351" fill="#006E67" font-size="18" font-weight="700" text-anchor="start">P5 ↔ P2</text>
<rect x="48" y="397" width="384" height="302" rx="12" fill="#FFFFFF" stroke="#BFCFD3" stroke-width="1.5"/>
<text x="71" y="437" fill="#182D36" font-size="24" font-weight="700" text-anchor="start">초음파 HC-SR04P × 5</text>
<text x="71" y="476" fill="#526976" font-size="16" font-weight="700" text-anchor="start">센서</text>
<text x="168" y="476" fill="#526976" font-size="16" font-weight="700" text-anchor="start">TRIG 출력</text>
<text x="284" y="476" fill="#526976" font-size="16" font-weight="700" text-anchor="start">ECHO 입력</text>
<path d="M71 489 H405" fill="none" stroke="#BFCFD3" stroke-width="1" />
<text x="71" y="521" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">S1</text>
<text x="168" y="521" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PC8</text>
<text x="284" y="521" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PA0</text>
<text x="71" y="556" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">S2</text>
<text x="168" y="556" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PC9</text>
<text x="284" y="556" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PA1</text>
<text x="71" y="591" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">S3</text>
<text x="168" y="591" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PC10</text>
<text x="284" y="591" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PA2</text>
<text x="71" y="626" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">S4</text>
<text x="168" y="626" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PC11</text>
<text x="284" y="626" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PA3</text>
<text x="71" y="661" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">S5</text>
<text x="168" y="661" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PC12</text>
<text x="284" y="661" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">PB6</text>
<rect x="454" y="397" width="519" height="302" rx="12" fill="#FFFFFF" stroke="#BFCFD3" stroke-width="1.5"/>
<text x="478" y="437" fill="#182D36" font-size="24" font-weight="700" text-anchor="start">현장 키트 · 모형 문</text>
<text x="478" y="485" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">LED 0 / 1</text>
<text x="615" y="485" fill="#182D36" font-size="17" font-weight="400" text-anchor="start">PA4 / PA5 → 상태 LED</text>
<path d="M478 505 H948" fill="none" stroke="#BFCFD3" stroke-width="1" />
<text x="478" y="545" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">PIEZO</text>
<text x="615" y="545" fill="#182D36" font-size="17" font-weight="400" text-anchor="start">PA6 · TIM3 CH1 → 부저</text>
<path d="M478 565 H948" fill="none" stroke="#BFCFD3" stroke-width="1" />
<text x="478" y="605" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">키패드</text>
<text x="615" y="605" fill="#182D36" font-size="17" font-weight="400" text-anchor="start">PC3…PC6 행 출력 / PC0…PC2 열 입력</text>
<path d="M478 625 H948" fill="none" stroke="#BFCFD3" stroke-width="1" />
<text x="478" y="665" fill="#182D36" font-size="19" font-weight="700" text-anchor="start">서보 SG90</text>
<text x="615" y="665" fill="#182D36" font-size="17" font-weight="400" text-anchor="start">PA8 · TIM1 CH1 → 신호선</text>
<rect x="998" y="397" width="394" height="302" rx="12" fill="#FFFFFF" stroke="#BFCFD3" stroke-width="1.5"/>
<text x="1021" y="437" fill="#182D36" font-size="25" font-weight="700" text-anchor="start">DESPI-C02</text>
<text x="1021" y="475" fill="#182D36" font-size="18" font-weight="400" text-anchor="start">P2 · 3.3V, GND, SDI, SCK,</text>
<text x="1021" y="506" fill="#182D36" font-size="18" font-weight="400" text-anchor="start">CS, D/C, RES, BUSY</text>
<path d="M1022 527 H1366" fill="none" stroke="#BFCFD3" stroke-width="1" />
<path d="M1051 540 V586" fill="none" stroke="#006E67" stroke-width="2.5" marker-end="url(#aArrow)"/>
<text x="1074" y="573" fill="#425866" font-size="18" font-weight="400" text-anchor="start">P1 → 패널 FPC</text>
<text x="1021" y="631" fill="#182D36" font-size="25" font-weight="700" text-anchor="start">GDEY075Z08</text>
<text x="1021" y="669" fill="#425866" font-size="18" font-weight="400" text-anchor="start">800 × 480 · 흑백적 3색 대상</text>
<rect x="48" y="724" width="1344" height="103" rx="12" fill="#EAF0F1" stroke="none" stroke-width="1.5"/>
<text x="71" y="760" fill="#182D36" font-size="20" font-weight="700" text-anchor="start">전원과 접지</text>
<text x="245" y="760" fill="#182D36" font-size="19" font-weight="400" text-anchor="start">보드 간 UART는 3.3V TTL이며 GND를 공유한다. 각 보드의 양극 전원 출력은 분리한다.</text>
<text x="245" y="795" fill="#425866" font-size="18" font-weight="400" text-anchor="start">서보 VCC는 정격과 전류 용량을 확인한 전원에서 공급한다. ECHO 전압은 STM32 연결 전에 측정한다.</text>
</svg>
