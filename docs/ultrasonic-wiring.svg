<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1120" viewBox="0 0 1560 1120" role="img" aria-labelledby="title desc">
  <title id="title">초음파 센서 5개와 STM32 보드 결선도</title>
  <desc id="desc">3.3V 센서 전원의 양극을 브레드보드 양극 레일에, 전원 음극과 MCU 모듈의 J5 4번 GND를 음극 레일에 연결한다. 각 센서 VCC와 GND를 이 두 레일에 연결하고 TRIG와 ECHO는 개별 STM32 핀에 직접 연결한다.</desc>
  <defs>
    <style>
      text { font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#192f39 }
      .title { font-size:43px; font-weight:700 }
      .head { font-size:26px; font-weight:700 }
      .normal { font-size:21px }
      .small { font-size:18px; fill:#48616a }
      .pin { font-size:23px; font-weight:700 }
      .red { fill:#b23d27 }
      .green { fill:#006b60 }
      .blue { fill:#285e9c }
      .dark { fill:#344753 }
      .net { fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round }
    </style>
    <marker id="forward" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 6 0 12z" fill="#007368"/></marker>
    <marker id="return" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 6 0 12z" fill="#2a67a6"/></marker>
    <g id="holes"><circle cx="0" cy="0" r="6"/><circle cx="45" cy="0" r="6"/><circle cx="90" cy="0" r="6"/><circle cx="135" cy="0" r="6"/><circle cx="180" cy="0" r="6"/></g>
  </defs>
  <rect width="1560" height="1120" fill="#f6f9f8"/>
  <text x="48" y="72" class="title">초음파 센서 5개와 STM32 보드 결선도</text>
  <text x="50" y="113" class="normal">HC-SR04P의 VCC와 GND는 다섯 개가 공유하고, TRIG와 ECHO는 센서마다 정해진 핀에 꽂는다.</text>

  <rect x="48" y="152" width="322" height="174" rx="12" fill="white" stroke="#bccbd0" stroke-width="2"/>
  <text x="70" y="188" class="head">센서용 3.3 V 전원</text>
  <text x="70" y="216" class="small">5개를 공급할 수 있는 정전압 전원</text>
  <text x="70" y="260" class="pin red">+3.3 V</text>
  <text x="70" y="307" class="pin dark">0 V / 음극 (−)</text>

  <rect x="48" y="349" width="322" height="197" rx="12" fill="white" stroke="#bccbd0" stroke-width="2"/>
  <text x="70" y="386" class="head">STM32 MCU 모듈</text>
  <text x="70" y="425" class="pin dark">J5의 4번 · GND</text>
  <text x="70" y="480" class="pin green">PC8 · 2-L · TRIG 출력</text>
  <text x="70" y="526" class="pin blue">PA0 · 1-L · ECHO 입력</text>

  <rect x="519" y="152" width="426" height="225" rx="12" fill="#fff" stroke="#bccbd0" stroke-width="2"/>
  <text x="542" y="188" class="head">브레드보드 전원 레일</text>
  <text x="542" y="216" class="small">같은 레일의 구멍에서 센서 5개로 분배</text>
  <rect x="542" y="237" width="380" height="31" rx="8" fill="#fbece8"/>
  <rect x="542" y="284" width="380" height="31" rx="8" fill="#edf1f3"/>
  <text x="559" y="353" class="small red">+ 레일 → VCC</text>
  <text x="731" y="353" class="small dark">− 레일 → GND</text>

  <rect x="1080" y="152" width="432" height="394" rx="12" fill="white" stroke="#bccbd0" stroke-width="2"/>
  <text x="1106" y="189" class="head">S1 · 복도 1 초음파 센서</text>
  <text x="1106" y="217" class="small">단자 이름은 센서 기판의 인쇄로 확인</text>
  <text x="1110" y="261" class="pin red">VCC</text><text x="1225" y="260" class="normal">센서 전원 입력</text>
  <text x="1110" y="308" class="pin dark">GND</text><text x="1225" y="307" class="normal">공통 접지</text>
  <text x="1110" y="480" class="pin green">TRIG</text><text x="1225" y="479" class="normal">측정 시작 입력</text>
  <text x="1110" y="526" class="pin blue">ECHO</text><text x="1225" y="525" class="normal">거리 펄스 출력</text>
  <path d="M1107 332 H1485" fill="none" stroke="#d8e2e4" stroke-width="2"/>
  <text x="1110" y="367" class="small">VCC·GND는 공통 레일에 한 가닥씩,</text>
  <text x="1110" y="396" class="small">TRIG·ECHO는 아래 표의 개별 핀에 연결.</text>

  <g class="net">
    <path d="M370 253 H1080" stroke="#b6412a"/>
    <path d="M370 300 H1080" stroke="#374955"/>
    <path d="M370 417 H443 V300" stroke="#374955"/>
    <path d="M370 472 H1080" stroke="#007368"/>
    <path d="M1080 518 H370" stroke="#2a67a6"/>
    <path d="M880 472 H917" stroke="#007368" marker-end="url(#forward)"/>
    <path d="M636 518 H599" stroke="#2a67a6" marker-end="url(#return)"/>
  </g>
  <g fill="#b6412a"><circle cx="370" cy="253" r="6"/><circle cx="1080" cy="253" r="6"/></g>
  <g fill="#374955"><circle cx="370" cy="300" r="6"/><circle cx="370" cy="417" r="6"/><circle cx="443" cy="300" r="7"/><circle cx="1080" cy="300" r="6"/></g>
  <g fill="#007368"><circle cx="370" cy="472" r="6"/><circle cx="1080" cy="472" r="6"/></g>
  <g fill="#2a67a6"><circle cx="370" cy="518" r="6"/><circle cx="1080" cy="518" r="6"/></g>
  <use href="#holes" x="640" y="253" fill="white" stroke="#b6412a" stroke-width="3"/>
  <use href="#holes" x="640" y="300" fill="white" stroke="#374955" stroke-width="3"/>
  <text x="526" y="414" class="normal dark">전원 음극과 보드 GND를 같은 − 레일에 연결</text>
  <text x="555" y="460" class="small green">S1 트리거 · STM32 → 센서</text>
  <text x="708" y="507" class="small blue">S1 에코 · 센서 → STM32</text>

  <rect x="48" y="582" width="472" height="350" rx="12" fill="white" stroke="#bccbd0" stroke-width="2"/>
  <text x="71" y="625" class="head">보드에서 GND 찾기</text>
  <text x="71" y="660" class="normal">J3와 MCU 칩 사이의 검은 2×10 JTAG 헤더</text>
  <text x="72" y="690" class="small">J5의 1번 표시를 기준으로 센다.</text>
  <rect x="77" y="715" width="333" height="106" rx="7" fill="#eaf0ef" stroke="#9db0b2" stroke-width="2"/>
  <path d="M63 726 72 736 63 746z" fill="#006b60"/>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="99" y="726" width="39" height="32" rx="3" fill="white" stroke="#70858d" stroke-width="2"/>
    <text x="119" y="750">1</text><text x="180" y="750">3</text><text x="242" y="750">5</text><text x="300" y="750">···</text><text x="365" y="750">19</text>
    <text x="119" y="802">2</text><rect x="157" y="776" width="46" height="35" rx="6" fill="#344753"/>
    <text x="180" y="802" style="fill:white">4</text><text x="242" y="802">6</text><text x="300" y="802">···</text><text x="365" y="802">20</text>
  </g>
  <text x="72" y="861" class="pin">4번 = GND → 브레드보드 −</text>
  <text x="72" y="892" class="small">1·2번 +3V3에는 외부 전원 +를 연결하지 않는다.</text>

  <rect x="544" y="582" width="968" height="350" rx="12" fill="white" stroke="#bccbd0" stroke-width="2"/>
  <text x="571" y="624" class="head">센서별로 꽂는 네 곳</text>
  <text x="852" y="622" class="small">교재 20쪽 기준 · 1-L / 1-R = J3 왼쪽 / 오른쪽 열 · 2-L = J4 왼쪽 열</text>
  <rect x="563" y="646" width="930" height="44" rx="6" fill="#e8f0ef"/>
  <g font-size="20" font-weight="700">
    <text x="577" y="675">센서</text><text x="776" y="675" class="red">VCC</text><text x="953" y="675" class="dark">GND</text><text x="1145" y="675" class="green">TRIG · 2-L</text><text x="1330" y="675" class="blue">ECHO · 소켓</text>
  </g>
  <g fill="none" stroke="#e0e8e8" stroke-width="1.5"><path d="M563 736 H1493 M563 781 H1493 M563 826 H1493 M563 871 H1493"/></g>
  <g class="normal">
    <text x="577" y="721">S1 · 복도 1</text><text x="776" y="721">+ 3.3 V 레일</text><text x="953" y="721">− GND 레일</text><text x="1145" y="721">PC8</text><text x="1330" y="721">PA0 · 1-L</text>
    <text x="577" y="766">S2 · 복도 2</text><text x="776" y="766">+ 3.3 V 레일</text><text x="953" y="766">− GND 레일</text><text x="1145" y="766">PC9</text><text x="1330" y="766">PA1 · 1-L</text>
    <text x="577" y="811">S3 · 복도 3</text><text x="776" y="811">+ 3.3 V 레일</text><text x="953" y="811">− GND 레일</text><text x="1145" y="811">PC10</text><text x="1330" y="811">PA2 · 1-L</text>
    <text x="577" y="856">S4 · 복도 4</text><text x="776" y="856">+ 3.3 V 레일</text><text x="953" y="856">− GND 레일</text><text x="1145" y="856">PC11</text><text x="1330" y="856">PA3 · 1-L</text>
    <text x="577" y="901">S5 · 위험지점</text><text x="776" y="901">+ 3.3 V 레일</text><text x="953" y="901">− GND 레일</text><text x="1145" y="901">PC12</text><text x="1330" y="901">PB6 · 1-R</text>
  </g>

  <rect x="48" y="958" width="1464" height="105" rx="12" fill="#edf3f1"/>
  <text x="72" y="997" class="normal" font-weight="700">결선 전 확인</text>
  <text x="228" y="997" class="normal">전원을 끄고 같은 레일에 꽂을 구멍끼리 도통을 확인한다. 중간이 끊긴 레일은 같은 극끼리만 점퍼로 잇는다.</text>
  <text x="228" y="1035" class="normal">ECHO의 HIGH가 3.3 V 수준인지 먼저 측정한다. 5 V 출력이면 STM32 입력 앞에 레벨 변환을 넣는다.</text>
  <text x="51" y="1096" class="small">근거 · 실험1-GPIO-InputOutput 20쪽 GPIO 소켓 · 21쪽 J5 회로도  /  STM32F103x8/xB 핀 정의  /  프로젝트 stm32/hardware.c</text>
</svg>