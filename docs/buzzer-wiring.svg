<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="725" viewBox="0 0 1100 725" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">키트 피에조 배선 · PA6에서 오디오 모듈 PIEZO까지</title>
  <desc id="desc">빨간 RESET 버튼을 오른쪽 아래로 놓은 STM32의 왼쪽 J3 헤더에서 왼쪽 열 PA6을 찾는다.
    점퍼 한 가닥으로 AUDIO MODULE의 둥근 버저 아래 두 줄 헤더에서 PIEZO라고 인쇄된 입력까지 연결한다.
    같은 키트에 장착한 모듈은 키트 전원과 접지를 사용한다.</desc>
  <defs>
    <style>
      text { font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; fill:#18343e; }
      .title { font-size:38px; font-weight:700; }
      .head { font-size:24px; font-weight:700; }
      .body { font-size:19px; }
      .note { font-size:16px; fill:#47616b; }
      .silk { font-weight:700; font-size:16px; fill:#344c48; }
      .pin { font-weight:700; font-size:20px; }
    </style>
    <g id="vertical"><circle r="3"/><circle cx="10" r="3"/></g>
    <g id="horizontal"><circle r="3"/><circle cy="11" r="3"/></g>
    <marker id="signal" viewBox="0 0 12 12" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#006b61"/>
    </marker>
  </defs>
  <rect width="1100" height="725" fill="#f4f8f7"/>
  <text x="38" y="59" class="title">키트 피에조 배선 · PA6 → PIEZO</text>
  <text x="40" y="99" class="body">HBE-MCU-MULTI 전원을 끄고, 같은 실습판에 장착한 두 모듈을 점퍼 한 가닥으로 잇는다.</text>

  <text x="46" y="156" class="head">STM32 MCU 모듈</text>
  <text x="46" y="189" class="note">빨간 RESET 버튼이 오른쪽 아래로 오게 놓는다.</text>
  <text x="579" y="156" class="head">AUDIO MODULE</text>
  <text x="579" y="189" class="note">중앙의 둥근 버저와 오른쪽의 HPhone·MIC 잭을 찾는다.</text>

  <rect x="57" y="213" width="417" height="287" rx="12" fill="#e4ece6" stroke="#8ba096" stroke-width="2"/>
  <rect x="579" y="213" width="469" height="287" rx="12" fill="#e4ece6" stroke="#8ba096" stroke-width="2"/>
  <g fill="#f4f8f7" stroke="#b7c6bd" stroke-width="3">
    <circle cx="74" cy="232" r="6"/><circle cx="457" cy="232" r="6"/>
    <circle cx="74" cy="483" r="6"/><circle cx="457" cy="483" r="6"/>
    <circle cx="595" cy="483" r="7"/><circle cx="1031" cy="483" r="7"/>
  </g>
  <text x="263" y="249" text-anchor="middle" class="silk">ARM Cortex-M3 MCU Module</text>
  <text x="121" y="276" text-anchor="middle" class="silk">J3</text>
  <text x="427" y="276" text-anchor="middle" class="silk">J4</text>
  <rect x="110" y="282" width="24" height="186" rx="4" fill="#304641"/>
  <rect x="417" y="282" width="24" height="186" rx="4" fill="#304641"/>
  <g fill="#a3b5ad">
    <use href="#vertical" x="117" y="289"/>
    <use href="#vertical" x="117" y="300.4"/>
    <use href="#vertical" x="117" y="311.8"/>
