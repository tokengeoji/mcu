  <text x="855" y="466" class="pin" style="fill:#006b61">PIEZO</text>

  <!-- One physical jumper. The arrow shows the direction of the timer output. -->
  <path d="M117 357.4 H51 Q35 357.4 35 373 V513 Q35 535 57 535 H800 Q823 535 823 512 V443"
        fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M117 357.4 H51 Q35 357.4 35 373 V513 Q35 535 57 535 H800 Q823 535 823 512 V443"
        fill="none" stroke="#006b61" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signal)"/>
  <circle cx="117" cy="357.4" r="6.5" fill="#006b61" stroke="#fff" stroke-width="2"/>
  <circle cx="823" cy="433" r="6.5" fill="#006b61" stroke="#fff" stroke-width="2"/>
  <text x="418" y="527" text-anchor="middle" class="pin" style="fill:#006b61">점퍼 1가닥 · 감지음 PWM</text>

  <text x="45" y="583" class="body">J3의 왼쪽 열(1-L)에서 PA6에 꽂는다.</text>
  <text x="579" y="583" class="body">버저 아래 두 줄 헤더의 PIEZO 입력에 꽂는다.</text>
  <rect x="40" y="607" width="1010" height="66" rx="8" fill="#e6efed"/>
  <text x="58" y="635" class="body">실습판에 장착된 오디오 모듈은 키트 전원과 공통 GND를 사용한다.</text>
  <text x="58" y="660" class="note">정렬 모드에서는 무음이다. 스캔 모드에서 평평한 표적을 정면 약 20 cm에 놓고 해당 방향에서 소리가 나는지 듣는다.</text>
  <text x="40" y="704" class="note">근거 · 실험3-Timer_Counter_PWM 교재 41쪽 모듈 사진 · 42쪽 압전 버저 회로 · 43쪽 PA6 결선 사진</text>
</svg>
