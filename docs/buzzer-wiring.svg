    <use href="#vertical" x="167" y="413"/>
    <use href="#vertical" x="167" y="426"/>
  </g>
  <text x="171" y="459" text-anchor="middle" class="silk">J5</text>
  <rect x="211" y="324" width="71" height="67" rx="6" fill="#5a6e65"/>
  <text x="246" y="363" text-anchor="middle" font-size="14" style="fill:white">STM32</text>
  <rect x="322" y="280" width="59" height="30" rx="5" fill="#ccd7cf" stroke="#a2b2a8"/>
  <text x="351" y="301" text-anchor="middle" font-size="13">PROG</text>
  <rect x="324" y="324" width="56" height="48" rx="4" fill="#fff" stroke="#a2b2a8"/>
