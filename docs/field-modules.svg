<svg xmlns="http://www.w3.org/2000/svg" id="fm-figure" viewBox="0 0 1520 1280" width="1520" height="1280" role="img" aria-labelledby="fm-title fm-description"><title id="fm-title">STM32와 현장 모듈 단자 결선도</title><desc id="fm-description">STM32 LED, 피에조, 키패드, PC용 UART 모듈과 SG90의 핀과 신호 방향을 나타낸다. 서보 전원 양극은 서보 V+로, 음극은 서보 GND 및 보드의 공통 GND로 연결한다.</desc><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1520" height="1280" rx="0" fill="#f6f9fa" stroke="none" stroke-width="1.5"/>
<text x="65" y="78" fill="#193747" font-size="46" font-weight="700" text-anchor="start">STM32와 현장 모듈 결선도</text>
<text x="66" y="122" fill="#496570" font-size="22" font-weight="400" text-anchor="start">같은 높이의 두 단자를 점퍼 한 가닥으로 잇는다. 화살표는 신호가 흐르는 방향이다.</text>
