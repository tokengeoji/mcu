<text x="191" y="1216" fill="#395562" font-size="20" font-weight="400" text-anchor="start">LED·PIEZO의 전원과 GND는 키트 백플레인에서 공급한다. 키패드는 행·열 접점 7개를 잇는다.</text>
<text x="66" y="1253" fill="#193747" font-size="20" font-weight="700" text-anchor="start">PC 통신</text>
<text x="191" y="1253" fill="#395562" font-size="20" font-weight="400" text-anchor="start">TX0·RX0는 실습 키트의 단자 인쇄 기준이다. 터미널은 9600 baud, 8N1, 흐름 제어 없음으로 연다.</text>
